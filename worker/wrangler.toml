# Worker "cucina-gemini": proxy fra l'app e Gemini.
# La chiave NON va qui: è il secret GEMINI_KEY (dashboard Cloudflare → Settings → Variables and Secrets).
name = "cucina-gemini"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
ORIGINI = "https://bighouse96.github.io"
MODELLI = "gemini-3.8-flash,gemini-3.5-flash-lite"
# Ricerca Google per «Cerca ricetta»: nel piano gratuito non è disponibile (429). "si" solo con la fatturazione attiva.
RICERCA_WEB = "no"

# Limite per IP: 10 richieste al minuto (Rate Limiting di Cloudflare)
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
